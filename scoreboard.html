<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SketchDuel - Standings</title>
<style>
  :root { --y:#ffd400; --bg:#0a0a08; --dim:#8a7500; --w:#f2f2e9; --red:#ff2d55; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--w);
    font-family: "Courier New", monospace; -webkit-font-smoothing: none; overflow-x: hidden; }
  #wrap { max-width: 560px; width: 100%; margin: 0 auto; padding: 28px 16px 48px; text-align: center; overflow: hidden; }
  h1 { color: var(--y); letter-spacing: 2px; font-size: clamp(22px, 7vw, 52px);
    margin: 10px 0 2px; text-shadow: 3px 3px 0 #000; white-space: nowrap; }
  h1 span { color: var(--w); }
  #bar { height: 8px; margin: 12px auto 6px; max-width: 320px;
    background: repeating-linear-gradient(-45deg, var(--y) 0 8px, var(--bg) 8px 16px); }
  #sub { color: var(--dim); letter-spacing: 4px; font-size: 14px; margin-bottom: 26px; }
  ol { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 15px 14px;
    margin: 0 3px 12px; background: #131310;
    box-shadow: 3px 0 0 var(--dim), -3px 0 0 var(--dim), 0 3px 0 var(--dim), 0 -3px 0 var(--dim); }
  li.champ { background: var(--y); color: #000; box-shadow: 3px 0 0 #000, -3px 0 0 #000, 0 3px 0 #000, 0 -3px 0 #000; }
  .rank { font-weight: bold; font-size: clamp(18px, 5vw, 22px); min-width: 26px; text-align: left; color: var(--y); }
  li.champ .rank { color: #000; }
  .name { flex: 1; min-width: 0; text-align: left; font-size: clamp(17px, 4.6vw, 22px);
    text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score { font-size: clamp(17px, 4.6vw, 22px); font-weight: bold; letter-spacing: 1px; white-space: nowrap; }
  #foot { margin-top: 34px; color: var(--dim); font-size: 13px; letter-spacing: 2px; }
  #foot b { color: var(--y); display: block; margin-bottom: 6px; letter-spacing: 3px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>SKETCH<span>.</span>DUEL</h1>
  <div id="bar" aria-hidden="true"></div>
  <div id="sub">FINAL STANDINGS</div>
  <ol id="board"></ol>
  <div id="foot"><b>SKETCH.DUEL</b>DRAW. IT GUESSES. NOBODY'S SAFE.</div>
</div>
<script>
  function b64urlDecode(s) {
    s = String(s).replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    return decodeURIComponent(escape(atob(s)));
  }
  try {
    var raw = new URLSearchParams(location.search).get("d") || "";
    var d = JSON.parse(b64urlDecode(raw));
    if (d.t) document.getElementById("sub").textContent = d.t;
    var board = document.getElementById("board");
    var players = (d.p || []).slice().sort(function (a, b) { return b.s - a.s; });
    if (!players.length) throw new Error("empty");
    players.forEach(function (p, i) {
      var li = document.createElement("li");
      if (i === 0) li.className = "champ";
      li.innerHTML = '<span class="rank"></span><span class="name"></span><span class="score"></span>';
      li.querySelector(".rank").textContent = (i + 1);
      li.querySelector(".name").textContent = p.n + (i === 0 ? "  ★" : "");
      li.querySelector(".score").textContent = String(p.s).padStart(4, "0");
      board.appendChild(li);
    });
  } catch (e) {
    document.getElementById("board").innerHTML =
      '<li style="justify-content:center"><span class="name" style="text-align:center">NO STANDINGS DATA</span></li>';
  }
</script>
</body>
</html>
